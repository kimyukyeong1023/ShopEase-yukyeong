<!-- main.html -->
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" 
        content="쉽고 빠르게 쇼핑하는 ShopEase 쇼핑몰입니다">

  <title>Document</title>

  <link rel="stylesheet" href="main.css">
</head>
<body>

  <div class="warp">
    <header class="header max-container">
      <div class="nav">
        <h1>ShopEase</h1>
        <ul>
          <li>Products</li>
          <li>Services</li>
          <li>Login</li>
        </ul>
      </div>
    </header>

    <main>
      <!-- 메인베너 -->
      <section class="main-banner">
        <img src="../images/img1.png" alt="광고이미지">
      </section>

      <!-- 상품들 -->
      <section class="main-products max-container">
        <h2>실시간 인기 랭킹 순위</h2>
        <p>가장 인기 있는 상품만 모아 봤습니다.</p>

        <div class="cards">
          <div class="card">
            <img src="../images/데님재킷.png" alt="데님재킷"
                 onclick="상세페이지로이동('데님재킷')">
            <button>담기</button>
            <p>데님재킷</p>
          </div>

          <div class="card">
            <img src="../images/베이지린넨셔츠.png" alt="베이지린넨셔츠"
                      onclick="상세페이지로이동('베이지린넨셔츠')">
            <button>담기</button>
            <p>베이지린넨셔츠</p>
          </div>

          <div class="card">
            <img src="../images/베이직에코백.png" alt="베이직에코백"
                  onclick="상세페이지로이동('베이직에코백')">
            <button>담기</button>
            <p>베이직에코백</p>
          </div>

          <div class="card">
            <img src="../images/스프라이트티셔츠.png" alt="스프라이트티셔츠"
                 onclick="상세페이지로이동('스프라이트티셔츠')">
            <button>담기</button>
            <p>스프라이트티셔츠</p>
          </div>
        </div>
      </section>

      <!-- 상품들 -->
      <section class="main-products max-container">
        <h2>실시간 인기 랭킹 순위</h2>
        <p>가장 인기 있는 상품만 모아 봤습니다.</p>

        <div class="cards">
          <div class="card">
            <img src="../images/연베이지니트가디건.png" alt="연베이지니트가디건"
                 onclick="상세페이지로이동('연베이지니트가디건')">
            <button>담기</button>
            <p>연베이지니트가디건</p>
          </div>

          <div class="card">
            <img src="../images/차콜그레이와이드팬츠.png" alt="차콜그레이와이드팬츠"
                 onclick="상세페이지로이동('차콜그레이와이드팬츠')">
            <button>담기</button>
            <p>차콜그레이와이드팬츠</p>
          </div>

          <div class="card">
            <img src="../images/트렌치코트.png" alt="트렌치코트"
                 onclick="상세페이지로이동('트렌치코트')">
            <button>담기</button>
            <p>트렌치코트</p>
          </div>

          <div class="card">
            <img src="../images/패턴롱원피스.png" alt="패턴롱원피스"
                 onclick="상세페이지로이동('패턴롱원피스')">
            <button>담기</button>
            <p>패턴롱원피스</p>
          </div>
        </div>
      </section>
    </main>

    <footer class="max-container">
      ⓒ 2017 SEOHEE COMPANY.
    </footer>
  </div>

  <script src="main.js"></script>
</body>
</html>
